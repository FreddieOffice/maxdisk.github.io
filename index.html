<h1>Tin Game Engine</h1>
<pre>
OpenGL game engine written in C++17

Uses:
GLFW for creating and managing a window
Glad2 for loading the opengl context
glm for math
SOIL2 for loading images
ImGui for gui
nlohmann's json for working with json files
